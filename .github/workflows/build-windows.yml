name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: EXE bauen
        run: pyinstaller ShortFlow-windows.spec --clean --noconfirm

      - name: Smoke-Test (Startet die EXE, faengt Startup-Crash ab)
        shell: pwsh
        run: |
          $log = Join-Path $env:USERPROFILE "ShortFlow_log.txt"
          if (Test-Path $log) { Remove-Item $log -Force }
          $exe = "dist/ShortFlow/ShortFlow.exe"
          Write-Host "Starte $exe ..."
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Host "::error::EXE ist beim Start abgestuerzt (Exit-Code $($p.ExitCode))."
            if (Test-Path $log) {
              Write-Host "----- ShortFlow_log.txt -----"
              Get-Content $log | Write-Host
              Write-Host "----- Ende Log -----"
            } else {
              Write-Host "Kein Logfile gefunden."
            }
          } else {
            Write-Host "EXE laeuft nach 20s noch -> sauberer Start. Beende Prozess."
            Stop-Process -Id $p.Id -Force
            if (Test-Path $log) {
              Write-Host "Hinweis: Logfile existiert trotzdem:"
              Get-Content $log | Write-Host
            }
          }

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ShortFlow-Windows
          path: dist/ShortFlow/
          retention-days: 30
